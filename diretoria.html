<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diretoria - ANACLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo"><img src="imagens/estaticas/bandeira_3D.png" alt="ANACLA"><span>ANACLA</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="historia.html">História</a>
        <a href="diretoria.html">Diretoria</a>
        <a href="biografias.html">Acadêmicos</a>
        <a href="eventos.html">Eventos</a>
        <a href="noticias.html">Notícias</a>
        <a href="contato.html">Contato</a>
    </div>
    <button class="hamburger" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
</nav>

<div class="menu-mobile" id="menuMobile">
    <a href="index.html">Home</a>
    <a href="historia.html">História</a>
    <a href="diretoria.html">Diretoria</a>
    <a href="biografias.html">Acadêmicos</a>
    <a href="eventos.html">Eventos</a>
    <a href="noticias.html">Notícias</a>
    <a href="contato.html">Contato</a>
</div>

<header class="hero" style="padding: 40px 20px;">
    <h1>Diretoria Atual</h1>
    <p>Mandato 2024-2026</p>
</header>

<section class="section">
    <div class="cards" id="diretoria">
        <div class="loading">Carregando diretoria...</div>
    </div>
</section>

<footer class="footer">
    <h3>ANACLA</h3>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</footer>

<script>
function toggleMenu() { document.getElementById('menuMobile').classList.toggle('active'); }
</script>
<script src="js/sheets.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('diretoria');
    try {
        const [diretoria, academicos] = await Promise.all([
            sheets.buscarDiretoria(),
            sheets.buscarAcademicos()
        ]);
        container.innerHTML = diretoria.map(cargo => {
            const ac = academicos.find(a => a.cadeira === cargo.academico_id);
            const foto = ac ? sheets.converterLink(ac.foto_url, ac.cadeira) : 'imagens/estaticas/placeholder.svg';
            const nome = ac ? ac.nome : 'Não informado';
            return '<div class="card" style="text-align:center;">' +
                '<img src="' + foto + '" style="height:250px;object-fit:cover;" onerror="this.src=\'imagens/estaticas/placeholder.svg\'">' +
                '<div class="card-content">' +
                '<h3 class="card-title">' + cargo.cargo + '</h3>' +
                '<p style="font-weight:bold;">' + nome + '</p>' +
                '<p style="color:#666;">' + cargo.periodo_inicio + ' - ' + cargo.periodo_fim + '</p>' +
                '</div></div>';
        }).join('');
    } catch(e) {
        container.innerHTML = '<div class="loading">Erro ao carregar.</div>';
    }
});
</script>

</body>
</html>
