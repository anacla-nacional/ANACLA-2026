<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias - ANACLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo"><img src="imagens/estaticas/bandeira_3D.png" alt="ANACLA"><span>ANACLA</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="historia.html">História</a>
        <a href="diretoria.html">Diretoria</a>
        <a href="biografias.html">Acadêmicos</a>
        <a href="eventos.html">Eventos</a>
        <a href="noticias.html">Notícias</a>
        <a href="contato.html">Contato</a>
    </div>
    <button class="hamburger" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
</nav>

<div class="menu-mobile" id="menuMobile">
    <a href="index.html">Home</a>
    <a href="historia.html">História</a>
    <a href="diretoria.html">Diretoria</a>
    <a href="biografias.html">Acadêmicos</a>
    <a href="eventos.html">Eventos</a>
    <a href="noticias.html">Notícias</a>
    <a href="contato.html">Contato</a>
</div>

<header class="hero" style="padding: 40px 20px;">
    <h1>Notícias</h1>
</header>

<section class="section">
    <div class="cards" id="noticias">
        <div class="loading">Carregando notícias...</div>
    </div>
</section>

<footer class="footer">
    <h3>ANACLA</h3>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</footer>

<script>
function toggleMenu() { document.getElementById('menuMobile').classList.toggle('active'); }
</script>
<script src="js/sheets.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('noticias');
    try {
        const noticias = await sheets.buscarNoticias();
        container.innerHTML = noticias.map(n => {
            const foto = n.imagem_url ? sheets.converterLink(n.imagem_url, '') : 'imagens/estaticas/placeholder.svg';
            return '<div class="card">' +
                '<img src="' + foto + '" onerror="this.src=\'imagens/estaticas/placeholder.svg\'">' +
                '<div class="card-content">' +
                '<p style="color:#666;font-size:0.9rem;">' + n.data + '</p>' +
                '<h3 class="card-title">' + n.titulo + '</h3>' +
                '<p class="card-text">' + (n.resumo || '') + '</p>' +
                '</div></div>';
        }).join('');
    } catch(e) {
        container.innerHTML = '<div class="loading">Erro ao carregar.</div>';
    }
});
</script>

</body>
</html>
