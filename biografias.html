<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biografias - ANACLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo"><img src="imagens/estaticas/bandeira_3D.png" alt="ANACLA"><span>ANACLA</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="historia.html">História</a>
        <a href="diretoria.html">Diretoria</a>
        <a href="biografias.html">Acadêmicos</a>
        <a href="eventos.html">Eventos</a>
        <a href="noticias.html">Notícias</a>
        <a href="contato.html">Contato</a>
    </div>
    <button class="hamburger" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
</nav>

<div class="menu-mobile" id="menuMobile">
    <a href="index.html">Home</a>
    <a href="historia.html">História</a>
    <a href="diretoria.html">Diretoria</a>
    <a href="biografias.html">Acadêmicos</a>
    <a href="eventos.html">Eventos</a>
    <a href="noticias.html">Notícias</a>
    <a href="contato.html">Contato</a>
</div>

<header class="hero" style="padding: 40px 20px;">
    <h1>Biografias dos Acadêmicos</h1>
</header>

<section class="section">
    <div class="cards" id="biografias">
        <div class="loading">Carregando biografias...</div>
    </div>
</section>

<div class="modal" id="modal" onclick="if(event.target===this)fecharModal()">
    <div class="modal-content">
        <span class="modal-close" onclick="fecharModal()">&times;</span>
        <h2 id="modal-titulo" style="color:var(--cor);margin-bottom:10px;"></h2>
        <p id="modal-cadeira" style="color:#666;margin-bottom:5px;"></p>
        <p id="modal-patrono" style="color:#888;margin-bottom:5px;font-style:italic;"></p>
        <p id="modal-data" style="color:#888;margin-bottom:15px;"></p>
        <img id="modal-foto" style="max-width:200px;border-radius:50%;margin-bottom:15px;">
        <p id="modal-bio"></p>
    </div>
</div>

<footer class="footer">
    <h3>ANACLA</h3>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</footer>

<script>
function toggleMenu() { document.getElementById('menuMobile').classList.toggle('active'); }
function fecharModal() { document.getElementById('modal').style.display = 'none'; }
</script>
<script src="js/sheets.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('biografias');
    try {
        const academicos = await sheets.buscarAcademicos();
        container.innerHTML = academicos.map(ac => {
            const foto = sheets.converterLink(ac.foto_url, ac.cadeira);
            const patronoInfo = ac.patrono ? '<p style="color:#888;font-size:0.8rem;margin-top:5px;font-style:italic;">' + ac.patrono + '</p>' : '';
            return '<div class="card" style="text-align:center;cursor:pointer;" onclick="abrirBio(\'' + ac.cadeira + '\')">' +
                '<img src="' + foto + '" style="height:250px;object-fit:cover;" onerror="this.src=\'imagens/estaticas/placeholder.svg\'">' +
                '<div class="card-content">' +
                '<span style="background:var(--cor);color:white;padding:5px 15px;border-radius:20px;font-size:0.8rem;">Cadeira ' + ac.cadeira + '</span>' +
                '<h3 class="card-title" style="margin-top:10px;">' + ac.nome + '</h3>' +
                patronoInfo +
                '</div></div>';
        }).join('');
    } catch(e) {
        container.innerHTML = '<div class="loading">Erro ao carregar.</div>';
    }
});

async function abrirBio(cadeira) {
    const ac = (await sheets.buscarAcademicos()).find(a => a.cadeira === cadeira);
    if (ac) {
        document.getElementById('modal-titulo').textContent = ac.nome;
        document.getElementById('modal-cadeira').textContent = 'Cadeira ' + ac.cadeira;
        document.getElementById('modal-patrono').textContent = ac.patrono ? 'Patrono(a): ' + ac.patrono : '';
        document.getElementById('modal-data').textContent = ac.data_posse ? 'Data de Posse: ' + ac.data_posse : '';
        document.getElementById('modal-foto').src = sheets.converterLink(ac.foto_url, ac.cadeira);
        document.getElementById('modal-bio').textContent = ac.biografia || 'Biografia não disponível.';
        document.getElementById('modal').style.display = 'block';
    }
}
</script>

</body>
</html>
