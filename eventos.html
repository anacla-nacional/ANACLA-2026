<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - ANACLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo"><img src="imagens/estaticas/bandeira_3D.png" alt="ANACLA"><span>ANACLA</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="historia.html">História</a>
        <a href="diretoria.html">Diretoria</a>
        <a href="biografias.html">Acadêmicos</a>
        <a href="eventos.html">Eventos</a>
        <a href="noticias.html">Notícias</a>
        <a href="contato.html">Contato</a>
    </div>
    <button class="hamburger" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
</nav>

<div class="menu-mobile" id="menuMobile">
    <a href="index.html">Home</a>
    <a href="historia.html">História</a>
    <a href="diretoria.html">Diretoria</a>
    <a href="biografias.html">Acadêmicos</a>
    <a href="eventos.html">Eventos</a>
    <a href="noticias.html">Notícias</a>
    <a href="contato.html">Contato</a>
</div>

<header class="hero" style="padding: 40px 20px;">
    <h1>Eventos</h1>
</header>

<section class="section">
    <div style="text-align:center;margin-bottom:30px;">
        <a href="eventos.html" class="btn">Todos</a>
        <a href="eventos.html?tipo=oficial" class="btn" style="background:#666;">Oficiais</a>
        <a href="eventos.html?tipo=mosalc" class="btn" style="background:#666;">MOSALC</a>
        <a href="eventos.html?tipo=feira" class="btn" style="background:#666;">Feiras</a>
    </div>
    <div id="eventos">
        <div class="loading">Carregando eventos...</div>
    </div>
</section>

<footer class="footer">
    <h3>ANACLA</h3>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</footer>

<script>
function toggleMenu() { document.getElementById('menuMobile').classList.toggle('active'); }
</script>
<script src="js/sheets.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('eventos');
    const params = new URLSearchParams(window.location.search);
    const tipo = params.get('tipo') || 'todos';
    try {
        const eventos = await sheets.buscarEventos(tipo);
        container.innerHTML = '<div class="cards">' + eventos.map(ev => {
            const foto = ev.imagem_url ? sheets.converterLink(ev.imagem_url, '') : 'imagens/estaticas/placeholder.svg';
            return '<div class="card">' +
                '<img src="' + foto + '" onerror="this.src=\'imagens/estaticas/placeholder.svg\'">' +
                '<div class="card-content">' +
                '<h3 class="card-title">' + ev.titulo + '</h3>' +
                '<p style="color:#666;"><i class="fas fa-calendar"></i> ' + ev.data + ' | <i class="fas fa-map-marker-alt"></i> ' + ev.local + '</p>' +
                '<p style="margin-top:10px;">' + (ev.descricao || '') + '</p>' +
                '</div></div>';
        }).join('') + '</div>';
    } catch(e) {
        container.innerHTML = '<div class="loading">Erro ao carregar.</div>';
    }
});
</script>

</body>
</html>
