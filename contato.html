    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <a href="index.html" class="logo"><img src="imagens/estaticas/bandeira_3D.png" alt="ANACLA"><span>ANACLA</span></a>
    <div class="nav-links">

<div class="menu-mobile" id="menuMobile">
    <a href="index.html">Home</a>
    <a href="historia.html">História</a>
    <a href="diretoria.html">Diretoria</a>

<header class="hero" style="padding: 40px 20px;">
    <h1>Contato</h1>
</header>

<section class="section">
    <div style="max-width:600px;margin:0 auto;">
        <div class="contato-grid" style="margin-bottom:30px;">
            <div class="contato-card">
                <i class="fab fa-whatsapp"></i>
                <h3>Secretaria</h3>
                <p>(48) 984 324 698</p>
            </div>
            <div class="contato-card">
                <i class="fab fa-whatsapp"></i>
                <h3>Presidência</h3>
                <p>(48) 991 260 621</p>
            </div>
        </div>
        
        <div class="card" style="padding:30px;">
            <h2 style="color:var(--cor);text-align:center;margin-bottom:25px;">Envie sua mensagem</h2>
            <form id="form-contato">
                <div style="margin-bottom:15px;">
                    <label style="display:block;margin-bottom:5px;font-weight:bold;">Nome *</label>
                    <input type="text" name="nome" required style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block;margin-bottom:5px;font-weight:bold;">Email *</label>
                    <input type="email" name="email" required style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block;margin-bottom:5px;font-weight:bold;">Fone</label>
                    <input type="tel" name="fone" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block;margin-bottom:5px;font-weight:bold;">Mensagem *</label>
                    <textarea name="mensagem" rows="4" maxlength="300" required style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;"></textarea>
                </div>
                <div style="text-align:center;">
                    <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Enviar</button>
                </div>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <h3>ANACLA</h3>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</footer>

<script>
function toggleMenu() { document.getElementById('menuMobile').classList.toggle('active'); }
document.getElementById('form-contato').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Mensagem enviada com sucesso!');
    this.reset();
});
</script>

</body>
</html>
